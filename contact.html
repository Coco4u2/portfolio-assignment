<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic page information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me | My Portfolio</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Stylesheets for different screen sizes -->
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/tablet.css">
    <link rel="stylesheet" href="css/laptop.css">
</head>

<body>

    <!-- Header containing the website title and navigation -->
    <header>
        <h1>My Portfolio</h1>

        <!-- Main navigation -->
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact Me</a>
        </nav>
    </header>

    <!-- Main content of the Contact Me page -->
    <main>

        <!-- Contact form section -->
        <section>
            <h2>Contact Me</h2>

            <p>
                If you would like to get in touch with me, please complete
                the form below.
            </p>

            <!-- Contact form used to collect visitor information -->
            <form
                action="mailto:jeffery.nnabuife@ontariotechu.net"
                method="post"
                enctype="text/plain"
                name="form">

                <!-- Name field -->
                <p>
                    <label for="name">Name:</label>
                    <input type="text"
                           id="name"
                           name="name"
                           size="32"
                           placeholder="Enter your name"
                           required>
                </p>

                <!-- Email field -->
                <p>
                    <label for="email">Email:</label>
                    <input type="email"
                           id="email"
                           name="email"
                           size="32"
                           placeholder="Enter your email address"
                           required>
                </p>

                <!-- Cell number field -->
                <p>
                    <label for="phone">Cell Number:</label>
                    <input type="tel"
                           id="phone"
                           name="phone"
                           size="32"
                           placeholder="Enter your cell number"
                           pattern="[0-9]{10}"
                           required>
                </p>

                <!-- Comments field -->
                <p>
                    <label for="comments">Comments:</label>
                    <br>
                    <textarea id="comments"
                              name="comments"
                              cols="60"
                              rows="6"></textarea>
                </p>

                <!-- Form submission button -->
                <input type="submit" value="Submit">

            </form>

        </section>

    </main>

    <!-- Footer containing navigation, contact and copyright information -->
    <footer>

        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About Me</a> |
            <a href="projects.html">Projects</a> |
            <a href="contact.html">Contact Me</a>
        </nav>

        <p>
            Contact me at
            <a href="mailto:jeffery.nnabuife@ontariotechu.net">
                jeffery.nnabuife@ontariotechu.net
            </a>
        </p>

        <p>&copy; 2026 Jeffery Nnabuife. All rights reserved.</p>

    </footer>

</body>

</html>
